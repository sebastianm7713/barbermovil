name: barbers_app
description: App móvil para barbería
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.2
  dio: ^5.0.0
  shared_preferences: ^2.0.15
  intl: ^0.20.2
  table_calendar: ^3.0.9
  flutter_local_notifications: ^20.1.0
  cupertino_icons: ^1.0.5
  go_router: ^17.2.2
  google_fonts: ^8.0.2
  image_picker: ^1.1.2
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/barber-logo.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/barber-logo.jpg
    - assets/images/services/
    - assets/images/products/
